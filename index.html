<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIM DATA LOOKUP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #0f0f1e 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
      color: #fff;
    }

    /* Animated background */
    .matrix-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.08;
      overflow: hidden;
    }

    .matrix-column {
      position: absolute;
      top: -100%;
      color: #00ff88;
      font-size: 14px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      text-shadow: 0 0 5px #00ff88;
      animation: matrix-fall linear infinite;
      font-weight: bold;
    }

    @keyframes matrix-fall {
      0% { transform: translateY(-100%); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(100vh); opacity: 0; }
    }

    /* Floating background elements */
    .floating-orb {
      position: absolute;
      border-radius: 50%;
      opacity: 0.1;
      filter: blur(60px);
      animation: float 15s ease-in-out infinite;
    }

    .orb1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #00ff88, transparent);
      top: -200px;
      right: -200px;
      animation-delay: 0s;
    }

    .orb2 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #ff0080, transparent);
      bottom: -150px;
      left: -150px;
      animation-delay: 3s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, 30px); }
    }

    .box {
      background: rgba(15, 15, 35, 0.95);
      backdrop-filter: blur(10px);
      border: 2px solid #00ff88;
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.4), inset 0 0 20px rgba(0, 255, 136, 0.1);
      padding: 40px 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      position: relative;
      z-index: 10;
      animation: slideIn 0.8s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .top-title {
      color: #00ff88;
      text-shadow: 0 0 15px #00ff88;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .box h2 {
      color: #fff;
      font-size: 28px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
      letter-spacing: 1px;
      font-weight: 700;
    }

    .input-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      position: relative;
    }

    .input-container::before {
      content: '🔍';
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
    }

    .box input {
      width: 100%;
      padding: 14px 15px 14px 45px;
      border-radius: 8px;
      border: 2px solid rgba(0, 255, 136, 0.3);
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      color: #00ff88;
      box-shadow: inset 0 0 15px rgba(0, 255, 136, 0.1), 0 0 20px rgba(0, 255, 136, 0.1);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: all 0.3s ease;
    }

    .box input:focus {
      outline: none;
      border-color: #00ff88;
      box-shadow: inset 0 0 15px rgba(0, 255, 136, 0.2), 0 0 30px rgba(0, 255, 136, 0.3);
      background: rgba(0, 20, 0, 0.8);
    }

    .box input::placeholder {
      color: rgba(0, 255, 136, 0.5);
    }

    .box button {
      width: 100%;
      padding: 14px;
      border: 2px solid #00ff88;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #000;
      background: linear-gradient(135deg, #00ff88 0%, #00dd77 100%);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
      transition: all 0.3s ease;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }

    .box button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transition: left 0.3s ease;
    }

    .box button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0, 255, 136, 0.6);
      background: linear-gradient(135deg, #00dd77 0%, #00ff88 100%);
    }

    .box button:hover::before {
      left: 100%;
    }

    .box button:active {
      transform: translateY(-1px);
    }

    #responseBox {
      color: #00ff88;
      margin: 20px auto 0;
      font-size: 13px;
      display: none;
      background: rgba(0, 20, 0, 0.8);
      border: 2px solid rgba(0, 255, 136, 0.5);
      padding: 15px;
      border-radius: 8px;
      text-align: left;
      font-family: 'Courier New', monospace;
      line-height: 1.8;
      width: 100%;
      box-shadow: inset 0 0 20px rgba(0, 255, 136, 0.1), 0 0 20px rgba(0, 255, 136, 0.2);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .blink {
      animation: blink 1s infinite;
      color: #ff0080;
    }

    @keyframes blink {
      0%, 49%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .footer {
      color: rgba(0, 255, 136, 0.6);
      margin-top: 20px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    #shareButton {
      background: linear-gradient(135deg, #25D366 0%, #1da853 100%) !important;
      border-color: #25D366 !important;
      box-shadow: 0 0 20px rgba(37, 211, 102, 0.4) !important;
    }

    #shareButton:hover {
      box-shadow: 0 8px 30px rgba(37, 211, 102, 0.6) !important;
    }

    @media (max-width: 480px) {
      .box {
        padding: 30px 20px;
        max-width: 95%;
      }

      .box h2 {
        font-size: 24px;
      }

      .top-title {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <!-- Matrix background animation -->
  <div class="matrix-bg" id="matrixBg"></div>

  <div class="box">
    <div class="top-title">M DATABASE
    +923086462372</div>
    <h2>🔍 SIM DATA TERMINAL</h2>
    <div class="input-container">
      <input type="text" id="number" placeholder="ENTER TARGET NUMBER" required />
    </div>
    <button onclick="fetchData()">⏎ EXECUTE QUERY</button>

    <div id="responseBox"></div>

    <button id="shareButton" onclick="shareWhatsApp()" style="display: none;">📲 EXPORT TO WHATSAPP</button>
    <div class="footer">DEVELOPED BY MAHAD</div>
  </div>

  <script>
    // Create matrix background animation
    function createMatrix() {
      const matrixBg = document.getElementById('matrixBg');
      const chars = "TEAM BLACK HAT0123456789";
      const columns = Math.floor(window.innerWidth / 20);
      
      for (let i = 0; i < columns; i++) {
        const column = document.createElement('div');
        column.className = 'matrix-column';
        column.style.left = (i * 20) + 'px';
        column.style.animationDuration = (Math.random() * 5 + 5) + 's';
        column.style.animationDelay = (Math.random() * 5) + 's';
        
        // Create random TEAM BLACK HAT text
        let text = '';
        const length = Math.floor(Math.random() * 10) + 10;
        for (let j = 0; j < length; j++) {
          text += chars.charAt(Math.floor(Math.random() * chars.length)) + '\n';
        }
        column.textContent = text;
        
        matrixBg.appendChild(column);
      }
    }

    // Initialize matrix animation
    window.onload = function() {
      createMatrix();
      typePlaceholder();
    };

    // Typing effect for input placeholder
    function typePlaceholder() {
      const input = document.getElementById("number");
      const originalPlaceholder = "ENTER TARGET NUMBER";
      let i = 0;
      
      function typing() {
        if (i < originalPlaceholder.length) {
          input.placeholder = originalPlaceholder.substring(0, i+1);
          i++;
          setTimeout(typing, Math.random() * 100 + 50);
        }
      }
      typing();
    }

    async function fetchData() {
      const number = document.getElementById("number").value.trim();
      const responseBox = document.getElementById("responseBox");
      const shareButton = document.getElementById("shareButton");

      if (!number) {
        alert("INPUT ERROR: NO TARGET SPECIFIED");
        return;
      }

      responseBox.innerHTML = `<div>CONNECTING TO DATABASE... <span class="blink">█</span></div>`;
      responseBox.style.display = "block";
      shareButton.style.display = "none";

      try {
        // Use local API endpoint
        const apiUrl = `/api/sim?num=${encodeURIComponent(number)}`;
        
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        const res = await fetch(apiUrl, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          },
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!res.ok) {
          throw new Error(`API returned status ${res.status}`);
        }

        const apiData = await res.json();

        setTimeout(() => {
          if (apiData.status === "success" && Array.isArray(apiData.data) && apiData.data.length > 0) {
            const user = apiData.data[0];
            const content = `
> DATABASE ENTRY FOUND
> -------------------
📞 MOBILE: ${user.Mobile || "NOT FOUND"}
👤 NAME: ${user.Name || "NOT FOUND"}
🆔 CNIC: ${user.CNIC || "NOT FOUND"}
📍 ADDRESS: ${user.Address || "NOT FOUND"}
📶 OPERATOR: ${user.Operator || "NOT FOUND"}
            `;
            responseBox.innerText = content;
            shareButton.style.display = "inline-block";
          } else if (apiData.status === "error") {
            responseBox.innerHTML = `<div style="color: #ff6b6b; font-weight: bold;">>> ERROR: ${apiData.message || "DATA NOT FOUND"}</div>`;
            shareButton.style.display = "none";
          } else {
            responseBox.innerHTML = `<div style="color: #ff6b6b; font-weight: bold;">>> ⚠ DATABASE SERVICE ERROR<br/>>>> PLEASE TRY AGAIN</div>`;
            shareButton.style.display = "none";
          }
        }, 1500);
      } catch (e) {
        console.error("Fetch error:", e);
        setTimeout(() => {
          responseBox.innerHTML = `<div style="color: #ff6b6b; font-weight: bold;">>> ⚠ CONNECTION ERROR<br/>>>> PLEASE TRY AGAIN</div>`;
          shareButton.style.display = "none";
        }, 1500);
      }
    }

    function shareWhatsApp() {
      const responseBox = document.getElementById("responseBox");
      const text = encodeURIComponent("Malik Mahad :\n" + responseBox.innerText);
      const url = `https://wa.me/+923086462372/?text=${text}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
